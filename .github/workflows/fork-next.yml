# Fork only: builds `next` (upstream main + this fork's feature branches) on every push and publishes the firmware
# as the "next-build" pre-release, so the latest build is always one download away.
name: Fork next build

on:
  push:
    branches: [next]
  workflow_dispatch:

jobs:
  build:
    if: github.repository != 'SynthstromAudible/DelugeFirmware'
    uses: ./.github/workflows/build.yml
    permissions:
      contents: write
    with:
      firmware-retention-days: 30
      build-type: "Release"
      build-tag: "dev"
      branch: "next"

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dev_Release_build_bundle
          path: bundle
      - name: Publish next-build pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          short=$(echo "$GITHUB_SHA" | cut -c1-8)
          cp bundle/deluge.bin "deluge-next-$short.bin"
          gh release delete next-build --yes --cleanup-tag || true
          gh release create next-build "deluge-next-$short.bin" \
            --target "$GITHUB_SHA" --prerelease \
            --title "next $short" \
            --notes "Upstream main plus this fork's feature branches (fork/branches.txt), at $GITHUB_SHA."
